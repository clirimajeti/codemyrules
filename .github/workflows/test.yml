name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # the tests create throwaway repos and commit in them
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      # pwsh is on every runner image; the PowerShell loop tests need PSScriptAnalyzer too
      - shell: pwsh
        run: if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
      - run: npm test
